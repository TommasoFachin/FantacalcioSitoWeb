{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">

    <div class="text-center">
        <h2 class="page-title fw-bold mb-4">Archivio Rose</h2>
        <p class="fs-5 text-muted">Seleziona una stagione per visualizzare le rose complete.</p>
    </div>

    <div class="row justify-content-center mt-5">
        <div class="col-md-8 col-lg-6">
            <div class="list-group shadow-sm">
                {% for season in seasons %}
                    <a href="{% url 'rose_detail' season.id %}" class="list-group-item list-group-item-action text-center fs-4 py-3">
                        Stagione {{ season.name }}
                    </a>
                {% endfor %}
            </div>
        </div>
    </div>

</div>
{% endblock %}
