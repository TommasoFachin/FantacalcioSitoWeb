{% extends 'base.html' %}

{% block content %}
<h2 class="fw-bold mb-4">Galleria FANTALEGA</h2>

<div class="row row-cols-1 row-cols-md-3 g-4">
    {% for m in immagini %}
    <div class="col">
        <div class="card h-100 shadow-sm border-0">
            {% if m.file %}
                <img src="{{ m.file.url }}" class="card-img-top" alt="{{ m.title }}" style="object-fit: cover; height: 250px;">
            {% else %}
                <div class="card-img-top bg-light d-flex align-items-center justify-content-center" style="height: 250px;">
                    <span class="text-muted">Nessun file</span>
                </div>
            {% endif %}
            <div class="card-body">
                <h5 class="card-title">{{ m.title }}</h5>
                <small class="text-muted">{{ m.uploaded_at|date:"d M Y" }}</small>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center text-muted py-5">L'admin non ha ancora caricato nessuna foto o video.</div>
    {% endfor %}
</div>
{% endblock %}
